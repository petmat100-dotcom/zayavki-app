[project]
name = "zayavki-app"
version = "1.0.0"
description = "Flet Zayavki App"
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "flet-camera",    
    "fpdf2",
    "httpx",
    "supabase"
]
[tool.flet]
org = "com.petmat"
product = "Zayavki"

[tool.flet.app]
path = "."

[tool.flet.android]
permissions = [
    "android.permission.CAMERA",
    "android.permission.READ_MEDIA_IMAGES",
    "android.permission.READ_EXTERNAL_STORAGE",
    "android.permission.WRITE_EXTERNAL_STORAGE"
]
extract_packages = ["supabase", "pydantic", "pydantic_core"]

# 👇 ДОБАВИТЬ ВОТ ЭТУ СЕКЦИЮ
[tool.flet.android.packaging_options]
pickFirsts = ["**/libc++_shared.so"]
