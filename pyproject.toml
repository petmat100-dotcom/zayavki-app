[project]
name = "zayavki-app"
version = "1.0.0"
description = "Flet Zayavki App"
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.2",
    "flet-camera",
    "flet-permission-handler",
    "fpdf2",
    "httpx",
    "supabase"
]

[tool.flet]
org = "com.petmat"
product = "Zayavki"

[tool.flet.app]
path = "."

[tool.flet.android.permission]
"android.permission.CAMERA" = true
"android.permission.READ_MEDIA_IMAGES" = true
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true

extract_packages = ["supabase", "pydantic", "pydantic_core", "flet_camera", "flet_permission_handler"]

[tool.flet.android.packaging_options]
pickFirsts = ["**/libc++_shared.so"]
